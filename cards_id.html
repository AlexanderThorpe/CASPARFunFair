<!DOCTYPE html>
<html>

    <head>
        <title>Card Prediction Game</title>
        <script src="jspsych-8.0/jspsych.js"></script>
        <script src="jspsych-8.0/plugin-html-button-response.js"></script>
        <script src="jspsych-8.0/plugin-html-keyboard-response.js"></script>
        <script src="jspsych-8.0/plugin-instructions.js"></script>
        <script src="jspsych-8.0/plugin-preload.js"></script>
        <link href="jspsych-8.0/jspsych.css" rel="stylesheet" type="text/css">
        <link href="styles/style.css" rel="stylesheet" />
        <link href="styles/styleCard.css" rel="stylesheet" />
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    </head>

    <body>
        <div id="scoreBox" class="scoreBox customfont" style="visibility: hidden">
            <p>
                <span id="score">POINTS: 0</span>
            </p>
        </div>

        <div class="loading customfont" style="background-image: url('img/loading_page1.jpg')">
            <p>Loading...</p>
        </div>

        <div class="prizeDiv" id="prizeDiv" style="background-image: url('img/prizeHead.png'); visibility: hidden">
            <div class="prizeHead">
            </div>
            <div class="starDiv" style="background-image: url('img/starBack.png')">
                <img class="prizeImg" id="starImg">
            </div>
            <div class="teddyDiv">
                <img class="prizeImg" id="teddyImg">
                <img class="prizeImg" id="nameTag">
            </div>
        </div>

        <div id="nextPage" class="redirect customfont" style="visibility: hidden">
            <p>
                Well done, you've finished this game!<br>
                Now let's play another game.
            </p>
        </div>


        <script src="/assets/javascripts/jatos.js"></script>
        <script>
            // What to do when jatos.js is finished initializing
            //UNCOMMENT FOR JATOS DEPLOYMENT
            jatos.onLoad(function() {
                studySessionData = jatos.studySessionData;
                username = studySessionData["username"];
                $(".loading").fadeOut("slow");
            });
            
            const jsPsych = initJsPsych();
            var timeline = [];

            /* Preload images */
            var preload = {
                    type: jsPsychPreload,
                    images: [
                        'img/iso_dis_background.png',
                        'img/card1.png',
                        'img/card1alt.png',
                        'img/card1_revealed.png',
                        'img/card2_revealed.png',
                        'img/iso_dis_instr.png',
                        'img/choose.png',
                        'img/won.png',
                        'img/lost.png'
                    ]
                };
                timeline.push(preload);

            var studySessionData;
            var username;
            var teddy;
            var dataOutput = [];
            var nPractice = 5;
            var nMain = 40;
            var totalPoints = 0;
            var nTrials = 0;

            // UNCOMMENT FOR JATOS DEPLOYMENT
            waitForJATOS();

            // Check whether JATOS has loaded before initialising
            function waitForJATOS() {
                let name = username;
                if (name !== undefined) {
                    const jsPsych = initJsPsych();
                    init();
                }
                else {
                    setTimeout(waitForJATOS, 300);
                }
            }

            /* Function to update score */
            function updateScore() {
                document.getElementById('score').innerText = 'POINTS: ' + totalPoints;
            }

            // Set up teddy image
            function teddyPicker(vars) {
                let source;
                if (vars.acc2) {
                    source = "img/teddy_everything.png";
                    return source;
                }
                if (vars.acc1) {
                    source = "img/teddy_lollipop.png";
                    return source;
                }
                source = "img/teddy_name.png";
                return source;
            }

            // Initialise the experiment
            function init() {
                setTimeline();
                document.getElementById("scoreBox").style.visibility = 'visible';
                document.getElementById("prizeDiv").style.visibility = 'visible';
                teddy = studySessionData.teddy;
                document.getElementById("starImg").src = "img/star" + studySessionData.nStars + ".png";
                if (teddy.name != null) {
                    imgName = teddyPicker(studySessionData.teddy);
                    document.getElementById("teddyImg").src = imgName;
                    tagName = "img/" + teddy.name + "Tag.png";
                    document.getElementById("nameTag").src = tagName;
                } else {
                    document.getElementsByClassName("teddyDiv")[0].style.visibility = 'hidden';
                }
                // Start experiment
                jsPsych.run(timeline);
            }

            // Save data, go to next component
            function endOfExperiment() {

                document.getElementById("nextPage").style.visibility = 'visible';

                studySessionData.nCompleted++;
                studySessionData.completedTasks["cards"] = true;
                studySessionData.cameFrom = "cards";
                studySessionData.totalPoints = studySessionData.totalPoints + totalPoints;
                taskIndex = studySessionData.taskIndex;
                studySessionData.taskIndex = taskIndex.slice(1);

                // Uncomment below for JATOS deployment
                jatos.studySessionData = studySessionData;

                setTimeout(() => {
                    jatos.uploadResultFile(dataOutput, "ID" + username + "_Cards_Data.csv")
                    .then(() => jatos.startComponentByPos(13));
                }, 3000);
            }

            // Set the variables to be pushed to the timeline
            function setTimeline() {

                /* Set up experiment instructions */
                var instructions1 = {
                    type: jsPsychInstructions,
                    pages: [
                        '<div class="instruction-container customfont"><br><br><br><span style="font-size:22pt">Welcome to the fortune teller\'s tent!</span><br><br>Here, you will play a card prediction game.<br>During each round, you will be shown two cards.<br>Your task is to guess which of the cards is white.<br><br>Click "Next" to start the practice rounds.<br><br></div>'
                    ],
                    show_clickable_nav: true,
                    button_label_next: "Next",
                    button_label_previous: "Previous",
                    on_load: function () {
                        document.querySelectorAll('.jspsych-btn').forEach(btn => {
                            btn.classList.add('confirm-button', 'customfont');
                        });
                    }
                };

                var instructions2 = {
                    type: jsPsychInstructions,
                    pages: [
                        '<div class="instruction-container customfont"><br><br><br><span style="font-size:22pt">You completed the practice rounds.</span><br><br>We will now start with the main game.<br><br>Click below to begin.<br><br></div>'
                    ],
                    show_clickable_nav: true,
                    button_label_next: "Start",
                    button_label_previous: "Previous",
                    on_load: function () {
                        document.querySelectorAll('.jspsych-btn').forEach(btn => {
                            btn.classList.add('confirm-button', 'customfont');
                        });
                    }
                };

                /* Card choice trial for demo procedure */
                var demoCardChoice = {
                    type: jsPsychHtmlButtonResponse,
                    stimulus: '<div style="font-size:30px;"><br><img src="img/choose.png"><br></div>',
                    choices: [
                        '<img src="img/card1.png" style="width:217px; height:410px;">',
                        '<img src="img/card1.png" style="width:217px; height:410px;">'
                    ],
                    data: { trial_type: 'default' },
                    on_finish: function (data) {
                        var correctChoice = Math.random() < 0.5 ? 0 : 1;
                        data.correctChoice = correctChoice;
                        data.correct = data.response == correctChoice;
                        jsPsych.data.addProperties({ correctChoice: correctChoice });
                        data.username = studySessionData.username;
                        data.task = studySessionData.nCompleted + 1;
                    }
                };

                /* Card choice trial for main procedure */
                var cardChoice = {
                    type: jsPsychHtmlButtonResponse,
                    stimulus: '<div style="font-size:30px;"><br><img src="img/choose.png"><br></div>',
                    choices: function () {
                        var trialType = Math.random() < 0.5 ? 'distinct' : 'default';
                        jsPsych.data.addProperties({ trialType: trialType });
                        if (trialType === 'distinct') {
                            return ['<img src="img/card1.png" style="width:217px; height:410px;">', '<img src="img/card1alt.png" style="width:217px; height:410px;">'];
                        } else {
                            return ['<img src="img/card1.png" style="width:217px; height:410px;">', '<img src="img/card1.png" style="width:217px; height:410px;">'];
                        }
                    },
                    data: function () {
                        var trialType = jsPsych.data.get().last(1).values()[0].trialType;
                        return { trial_type: trialType };
                    },
                    on_finish: function (data) {
                        var correctChoice = Math.random() < 0.5 ? 0 : 1;
                        data.correctChoice = correctChoice;
                        data.correct = data.response == correctChoice;
                        if (data.correct) {
                            totalPoints += 20;
                        }
                        jsPsych.data.addProperties({ correctChoice: correctChoice });
                        data.username = studySessionData.username;
                        data.task = studySessionData.nCompleted + 1;
                        updateScore(); // Update score
                    }
                };

                /* Feedback trial */
                var feedback = {
                    type: jsPsychHtmlKeyboardResponse,
                    stimulus: function () {
                        nTrials += 1;
                        var last_trial = jsPsych.data.get().last(1).values()[0];
                        var correctChoice = last_trial.correctChoice;
                        var fbText = last_trial.correct ?
                            '<div style="font-size:35px; color: rgb(0,220,0); margin:1px;"><img src="img/won.png"><br><br></div>' :
                            '<div style="font-size:35px; color: rgb(250,0,0); margin:1px;"><img src="img/lost.png"><br><br></div>';

                        var card1_img = correctChoice === 0 ? 'img/card2_revealed.png' : 'img/card1_revealed.png';
                        var card2_img = correctChoice === 0 ? 'img/card1_revealed.png' : 'img/card2_revealed.png';

                        return fbText +
                            '<div style="display: flex; justify-content: space-around;">' +
                            '<img src="' + card1_img + '" style="width:217px; height:410px;">' +
                            '<img src="' + card2_img + '" style="width:217px; height:410px;">' +
                            '</div>';
                    },
                    choices: "NO_KEYS",
                    trial_duration: 1000
                };

                /* Practice procedure */
                var demo_procedure = {
                    timeline: [demoCardChoice, feedback],
                    repetitions: nPractice
                };

                /* Main procedure */
                var test_procedure = {
                    timeline: [cardChoice, feedback],
                    repetitions: nMain
                };

                // End of experiment
                const end_message = {
                    type: jsPsychHtmlKeyboardResponse,
                    stimulus: function () {
                        return '<div class="instruction-container customfont"><br><br><br><span style="font-size:22pt">Thank you for participating!</span><br><br><br>Your total points: ' + totalPoints + '</div>';
                    },
                    choices: "NO_KEYS",
                    trial_duration: 3000,
                    on_finish: function () {
                        dataOutput = jsPsych.data.get().csv();
                        endOfExperiment();
                    }
                };

                /* Timeline */
                timeline.push(instructions1);
                timeline.push(demo_procedure);
                timeline.push(instructions2);
                timeline.push(test_procedure);
                timeline.push(end_message);
            }

            init();

        </script>
    </body>

</html>
