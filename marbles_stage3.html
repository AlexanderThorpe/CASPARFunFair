<!DOCTYPE html>
<html>
    <head>
        <title>Guess the Marbles</title>
        <link href="styles/style.css" rel="stylesheet" />
        <link href="styles/styleLanding.css" rel="stylesheet" />
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Karla:400,700">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Oswald:300,400">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

        <!-- Load jsPsych from local folder -->
        <script src="jspsych-7.3.4/jspsych.js"></script>
        <script src="jspsych-7.3.4/plugin-preload.js"></script>
        <script src="jspsych-7.3.4/plugin-html-keyboard-response.js"></script>
        <script src="jspsych-7.3.4/plugin-html-button-response.js"></script>
        <script src="jspsych-7.3.4/plugin-survey-text.js"></script>
        <link href="jspsych-7.3.4/jspsych.css" rel="stylesheet" type="text/css">
        <link href="styles/style.css" rel="stylesheet" />
        <link href="styles/styleMarbles.css" rel="stylesheet" />
    </head>

    <body>

        <div class="experiment" id="jsPsych-space"></div>

        <div class="points-container customfont" id="points-container" style="visibility: hidden">
            <span id="points-counter">Points: 0</span>
        </div>

        <div class="loading customfont" style="background-image: url('img/loading_page1.jpg'); z-index: 100;">
        </div>

        <div class="prizeDiv" id="prizeDiv" style="background-image: url('img/prizeHead.png')">
            <div class="prizeHead">
            </div>
            <div class="starDiv" style="background-image: url('img/starBack.png'); left: 29%">
                <img class="prizeImg" id="starImg">
            </div>
            <!-- <div class="teddyDiv" style="left: 27%">
                <img class="prizeImg" id="teddyImg">
                <img class="prizeImg" id="nameTag">
            </div> -->
        </div>

        <div id="nextPage" class="redirect customfont" style="visibility: hidden">
            <p>
                Well done, you've finished this game!<br>
                Now let's play another game.
            </p>
        </div>

        <script src="/assets/javascripts/jatos.js"></script>
        <script>
            // What to do when jatos.js is finished initializing
            //UNCOMMENT FOR JATOS DEPLOYMENT
            jatos.onLoad(function() {
                studySessionData = jatos.studySessionData;
                username = studySessionData["username"];
            });

            $(window).bind("beforeunload", function(){
                return confirm(); 
            });

            var studySessionData;
            var username;
            var dataOutput = [];
            var timeline = [];
            var userGuess = '';
            var seenImages;
            var totalPoints = 0;
            var nGuesses = 0;

            // Image file paths in "img/" folder
            const images = [
                "img/Marbles_background_onenum.jpg",
                "img/jar1.png", "img/jar2.png", "img/jar3.png", "img/jar4.png",
                "img/jar2_1.png", "img/jar2_2.png", "img/jar2_3.png", "img/jar2_4.png",
                "img/twojars1.png", "img/twojars2.png", "img/twojars3.png", "img/twojars4.png"
            ];

            const jsPsych = initJsPsych({display_element: 'jsPsych-space'});

            var preload = {
                type: "preload",
                images: images
            };

            // Let's preload all the images so that they aren't loaded every time
            jsPsych.pluginAPI.preloadImages(images);

            var marblesImg = ['img/loading_page1.jpg', 'img/prizeHead.png', 'img/starBack.png', 'img/star1.png', 'img/star2.png', 'img/star3.png', 'img/star4.png', 'img/star5.png', 'img/star6.png',
            'img/star7.png', 'img/star8.png', 'img/Marbles_background_onenum.jpg', 'img/Marbles_background_manynum.jpg'];

            preLoader(marblesImg);

            // UNCOMMENT FOR JATOS DEPLOYMENT
            waitForJATOS();

            // Check whether JATOS has loaded before initialising
            function waitForJATOS() {
                let name = username;
                if (name !== undefined) {
                    init();
                }
                else {
                    setTimeout(waitForJATOS, 300);
                }
            }

            // Preload images
            function preLoader(imgList) {
                for (i = 0; i < imgList.length; i++) {
                    let img = new Image();
                    img.src = imgList[i];
                }
            }

            // Initialise the experiment
            function init() {
                $(".loading").fadeOut("slow");
                if (studySessionData.triviaMiss >= 3) {
                    document.body.style.backgroundImage = 'url(img/Marbles_background_manynum.jpg)'
                }
                makeTimeline();
                document.getElementById("points-container").style.visibility = 'visible';
                document.getElementById("starImg").src = "img/star" + studySessionData.nStars + ".png";
                // Start experiment
                jsPsych.run(timeline);
            }

            function saveGuess(guessBox) {
                userGuess = document.getElementById(guessBox).value;
                let respButtons = document.getElementsByClassName('answer-button');
                for (let i = 0; i < respButtons.length; i++) {
                    if (respButtons[i].disabled) {
                        respButtons[i].removeAttribute('disabled');
                    }
                }
            }

            function generateMarbleCount() {
                return Math.floor(Math.random() * (450 - 250 + 1)) + 250;
            }

            function generateTwoJarTotal() {
                return Math.floor(Math.random() * (300 - 150 + 1)) + 150;
            }

            function getRandomTwoJarImages() {
                return ["img/twojars1.png", "img/twojars2.png", "img/twojars3.png", "img/twojars4.png"].sort(() => Math.random() - 0.5);
            }

            var number_of_marbles = generateMarbleCount();
            var points = 0;

            function updatePoints() {
                document.getElementById("points-counter").innerText = "Points: " + points;
            }

            var instructions = {
                type: jsPsychHtmlButtonResponse,
                stimulus: `<div class="introBox"><p class="customfont" style="font-size: 30px">Welcome to the classic guessing game!<br>
                        You can win 100 points by guessing how many marbles are in a glass jar.<br><br>
                        In each round, you can see up to four different jars: click "Another jar" to reveal more.<br><br>
                        Once you're ready, enter your final guess and click "I'm sure".<br><br>
                        You will get two rounds of different jars.</p></div>`,
                button_html: function () {
                    return '<button class="choice-button customfont">Start</button>';
                },
                choices: ["Start"]
            };

            function createJarTrial(jarImages, trialNum, looping) {
                if (looping == false) {
                    seenImages = [jarImages[0]];
                    nGuesses = 0;
                }
                var startTime = performance.now();

                return {
                    type: jsPsychHtmlButtonResponse,
                    stimulus: function () {
                        let stimString = [];
                        if (trialNum == 2) {
                            stimString = `<div class="introBox" style="position: absolute; top: 0vh; left: 15vw; width: 70vw; height: auto"><p class="customfont" style="font-size: 30px">That wasn't quite right. Let's try again.</p></div>`;
                        }
                        for (jar = 0; jar < seenImages.length; jar++) {
                            stimString += `<img class="jar` + (jar + 1) + `" src="${seenImages[jar]}" width="300">`;
                        }
                        stimString += `<br><input type="number" class="number-box" id="guess" placeholder="Enter your guess" oninput="saveGuess('guess')"><br>`
                        return stimString;
                    },
                    choices: ["Another jar", "Guess", "I'm sure"],
                    button_html: function() {
                        let buttons = ['<button class="jspsych-btn response-buttons" style="left: 30vw">%choice%</button>', '<button disabled class="jspsych-btn response-buttons answer-button" style="left: 45vw">%choice%</button>',
                        '<button disabled class="jspsych-btn response-buttons answer-button" style="left: 60vw">%choice%</button>'];
                        if (seenImages.length == 4) {
                            buttons[0] = '<button disabled class="jspsych-btn response-buttons" style="left: 30vw">%choice%</button>';
                        }
                        return buttons;
                    },
                    on_finish: function (data) {
                        var endTime = performance.now();
                        var responseTime = endTime - startTime;
                        
                        if (data.response == 0 && seenImages.length < 4) {
                            seenImages.push(jarImages[seenImages.length]);
                            jsPsych.addNodeToEndOfTimeline(createJarTrial(jarImages, trialNum, true));
                        } 
                        else {
                            data.round = trialNum;
                            data.guess = userGuess;
                            data.rt = responseTime;
                            var error = Math.abs(userGuess - number_of_marbles);
                            if (error <= number_of_marbles * 0.1) {
                                points += 50;
                                updatePoints();
                                seenImages = [];
                                result = 1;
                            } else {
                                result = 0;
                            }
                            if (trialNum == 1) {
                                if (result == 1) {
                                    jsPsych.addNodeToEndOfTimeline(createTwoJarTrial(getRandomTwoJarImages(), false));
                                } else {
                                    if (data.response == 2 | (data.response == 1 & nGuesses == 3)) {
                                        number_of_marbles = generateMarbleCount();
                                        jsPsych.addNodeToEndOfTimeline(createJarTrial(
                                            ["img/jar2_1.png", "img/jar2_2.png", "img/jar2_3.png", "img/jar2_4.png"], 2, false));
                                    } else if (data.response == 1) {
                                        nGuesses += 1;
                                        jsPsych.addNodeToEndOfTimeline(createJarTrial(jarImages, trialNum, true));
                                    }
                                }
                            } else if (trialNum == 2) {
                                if (result == 1) {
                                    showFeedback(result);
                                    setTimeout(() => {
                                        endOfExperiment();
                                    }, 3000);
                                } else if (data.response == 2 | (data.response == 1 & nGuesses == 3)) {
                                    showFeedback(result);
                                    setTimeout(() => {
                                        endOfExperiment();
                                    }, 3000);
                                } else if (data.response == 1) {
                                    nGuesses += 1;
                                    jsPsych.addNodeToEndOfTimeline(createJarTrial(jarImages, trialNum, true));
                                }
                            }
                        }
                    }
                };
            }

            function createTwoJarTrial(twoJarImages, looping) {
                if (looping == false) {
                    seenImages = [twoJarImages[0]];
                }
                var new_number_of_marbles = generateTwoJarTotal();
                var startTime = performance.now();

                return {
                    type: jsPsychHtmlButtonResponse,
                    stimulus: function () {
                        let stimString = `<div class="introBox" style="position: absolute; top: 0vh; left: 15vw; width: 70vw; height: auto"><p class="customfont" style="font-size: 30px">You guessed so well in the first round that this time, 
                                we want you to guess the sum of marbles in two jars!</p></div>`;
                        for (jar = 0; jar < seenImages.length; jar++) {
                            stimString += `<img class="double-jar` + (jar + 1) + `" src="${seenImages[jar]}" width="300">`;
                        }
                        stimString += `<br><input type="number" class="number-box" id="final_guess" placeholder="Enter your guess" oninput="saveGuess('final_guess')"><br>`;
                        return stimString;
                    },
                    choices: ["Another jar", "Submit"],
                    button_html: function() {
                        let buttons = ['<button class="jspsych-btn response-buttons" style="left: 38vw">%choice%</button>',
                        '<button disabled class="jspsych-btn response-buttons answer-button" style="left: 54vw">%choice%</button>'];
                        if (seenImages.length == 4) {
                            buttons[0] = '<button disabled class="jspsych-btn response-buttons" style="left: 38vw">%choice%</button>';
                        }
                        return buttons;
                    },
                    on_finish: function (data) {
                        var endTime = performance.now();
                        var responseTime = endTime - startTime;
                        var finalGuess = userGuess;

                        if (data.response == 0 && seenImages.length < 4) {
                            seenImages.push(twoJarImages[seenImages.length]);
                            jsPsych.addNodeToEndOfTimeline(createTwoJarTrial(twoJarImages, true));
                        } else {
                            data.round = 2;
                            data.guess = finalGuess;
                            data.rt = responseTime;
                            var error = Math.abs(finalGuess - new_number_of_marbles);
                            let result;
                            if (error <= new_number_of_marbles * 0.1) {
                                points += 50;
                                updatePoints();
                                result = 1;
                            } else {
                                result = 0;
                            }
                            showFeedback(result);
                            setTimeout(() => {
                                endOfExperiment();
                            }, 3000);
                        }
                    }
                };
            }

            // Save data, go to next component
            function endOfExperiment() {
                $(window).unbind("beforeunload");

                document.getElementById("nextPage").innerText = `Well done, you've finished this game!\nNow let's play another game.`;

                studySessionData.nCompleted++;
                studySessionData.totalPoints = studySessionData.totalPoints + totalPoints;
                taskIndex = studySessionData.taskIndex;
                studySessionData.taskIndex = taskIndex.slice(1);

                studySessionData.completedTasks["marbles"] = true;
                studySessionData.cameFrom = "marbles";

                dataOutput = jsPsych.data.get().csv();

                // Uncomment below for JATOS deployment
                jatos.studySessionData = studySessionData;

                
                let filename = "ID" + username + "Marbles_Stage3_Data.csv";

                // Uncomment below for JATOS deployment
                setTimeout(() => {
                    jatos.uploadResultFile(dataOutput, filename)
                    .then(() => jatos.startComponentByPos(11));
                }, 3000);
            }

            function showFeedback(result) {
                let showText;
                if (result == 1) {
                    showText = "Wow, great guess!\nYou got it right!";
                } else {
                    showText = "Sorry, that wasn't quite it.\nBetter luck next time!";
                }
                document.getElementById("nextPage").innerText = showText;
                document.getElementById("nextPage").style.visibility = 'visible';
            }

            function makeTimeline() {
                const trial = createJarTrial(["img/jar1.png", "img/jar2.png", "img/jar3.png", "img/jar4.png"], 1, false)
                timeline.push(instructions, trial);
            }
        </script>
    </body>
</html>
